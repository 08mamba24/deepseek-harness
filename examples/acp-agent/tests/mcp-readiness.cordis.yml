# Live counterpart for the MCP cold-start readiness snapshot composition:
# the minimal fs-search-style tree plus one root-level `dsh-mcp-client`
# sibling, exactly the root-sibling shape a production host appends. The
# fixture server path rides $DSH_MCP_FIXTURE_SERVER; only record mode boots
# this file (the mcp-readiness scenario is authored, so it never re-records).
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    models:
      - id: deepseek-v4-pro

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: mcp-fixture
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: fixture
    command: !!js process.execPath
    args:
      - !!js process.env.DSH_MCP_FIXTURE_SERVER ?? ''
    # The delayed connect→listTools window is the point: it keeps the sibling
    # inside its registration window while the client drives initialize, and
    # makes the MCP tools register last so the pinned tool-schema order is
    # deterministic.
    env:
      STARTUP_RACE_LIST_TOOLS_DELAY_MS: '1200'
    cwd: !!js process.cwd()
    failOnStartupError: true
