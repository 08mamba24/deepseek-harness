# Minimal keyless composition with one root-level MCP sibling: real app,
# bash, and fixture MCP server whose connect→listTools window is delayed;
# replayed model. The sibling is appended at the root exactly the way a
# production host composes MCP clients, so the pinned first request/header
# proves the Loader-hosted initialize barrier end to end: the model-facing
# tool inventory carries mcp__fixture__* before the first prompt.
- id: llm-replay
  name: '@deepseek-ai/dsh-llm-replay'
  config:
    providers:
      - id: deepseek-official
        name: DeepSeek
        models:
          - id: deepseek-v4-pro

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: mcp-fixture
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: fixture
    command: !!js process.execPath
    args:
      - !!js process.env.DSH_MCP_FIXTURE_SERVER ?? ''
    # The delayed connect→listTools window is the point: it keeps the sibling
    # inside its registration window while the client drives initialize, and
    # makes the MCP tools register last so the pinned tool-schema order is
    # deterministic.
    env:
      STARTUP_RACE_LIST_TOOLS_DELAY_MS: '1200'
    cwd: !!js process.cwd()
    failOnStartupError: true
